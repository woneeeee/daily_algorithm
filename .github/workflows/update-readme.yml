name: Update README

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/update_readme.py
      - name: Commit README
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README 문제 목록 갱신"
          git push
